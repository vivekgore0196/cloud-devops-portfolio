apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      containers:
        - name: demo-web
          # The pipeline replaces this image reference before deployment.
          image: REPLACE_WITH_ACR_IMAGE
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: portfolio
spec:
  type: LoadBalancer
  selector:
    app: demo-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
